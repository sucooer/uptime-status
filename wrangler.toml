# Cloudflare Pages 配置（配合 @cloudflare/next-on-pages 使用）
# 部署命令：npm run pages:deploy
name = "uptime-status"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

# next-on-pages 的产物目录
pages_build_output_dir = ".vercel/output/static"

# 生产环境变量写在 Cloudflare Pages 控制台：
#   Settings -> Environment variables
#   - UPTIMEROBOT_API_KEY   （建议设为 Encrypt / Secret）
#   - NEXT_PUBLIC_SITE_TITLE 等（构建期生效，必须在 Build-time variables 里）
